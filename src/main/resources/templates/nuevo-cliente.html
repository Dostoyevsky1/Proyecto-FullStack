<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Nuevo cliente')}"></head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <aside th:replace="~{fragments/sidebar :: sidebar('clientes')}"></aside>
    <div class="app-main">
      <header th:replace="~{fragments/navbar :: navbar('Nuevo cliente')}"></header>
      <main class="page-content" id="contenido">
        <div class="page-heading"><div><a class="back-link" th:href="@{/clientes}"><i class="bi bi-arrow-left"></i>Clientes</a><h1>Nuevo cliente</h1></div></div>
        <form class="panel" th:action="@{/clientes}" th:object="${cliente}" method="post">
          <section class="form-section">
            <div class="section-heading"><span class="section-icon"><i class="bi bi-person"></i></span><div><h2>Datos personales</h2></div></div>
            <div class="row g-3">
              <div class="col-12 col-md-6"><label class="form-label" for="nombres">Nombres</label><input class="form-control" id="nombres" th:field="*{nombres}" required maxlength="80" /></div>
              <div class="col-12 col-md-6"><label class="form-label" for="apellidos">Apellidos</label><input class="form-control" id="apellidos" th:field="*{apellidos}" required maxlength="80" /></div>
              <div class="col-12 col-md-6"><label class="form-label" for="dni">DNI</label><input class="form-control" id="dni" th:field="*{dni}" maxlength="12" /></div>
              <div class="col-12 col-md-6"><label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label><input class="form-control" id="fechaNacimiento" type="date" th:field="*{fechaNacimiento}" /></div>
              <div class="col-12 col-md-6"><label class="form-label" for="telefono">Teléfono</label><input class="form-control" id="telefono" th:field="*{telefono}" maxlength="20" /></div>
              <div class="col-12 col-md-6"><label class="form-label" for="correo">Correo</label><input class="form-control" id="correo" type="email" th:field="*{correo}" /></div>
              <div class="col-12"><label class="form-label" for="direccion">Dirección</label><input class="form-control" id="direccion" th:field="*{direccion}" /></div>
            </div>
          </section>
          <section class="form-section">
            <div class="section-heading"><span class="section-icon"><i class="bi bi-flower2"></i></span><div><h2>Información capilar</h2></div></div>
            <div class="row g-3">
              <div class="col-12 col-md-4"><label class="form-label" for="tipoCabello">Tipo de cabello</label><select class="form-select" id="tipoCabello" th:field="*{tipoCabello}" required><option value="">Selecciona</option><option th:each="tipo : ${#strings.arraySplit('2A,2B,2C,3A,3B,3C,4A,4B,4C', ',')}" th:value="${tipo}" th:text="${tipo}"></option></select></div>
              <div class="col-12 col-md-4"><label class="form-label" for="porosidad">Porosidad</label><select class="form-select" id="porosidad" th:field="*{porosidad}"><option value="Baja">Baja</option><option value="Media">Media</option><option value="Alta">Alta</option></select></div>
              <div class="col-12 col-md-4"><label class="form-label" for="densidad">Densidad</label><select class="form-select" id="densidad" th:field="*{densidad}"><option value="Baja">Baja</option><option value="Media">Media</option><option value="Alta">Alta</option></select></div>
              <div class="col-12 col-md-6"><label class="form-label" for="alergias">Alergias conocidas</label><input class="form-control" id="alergias" th:field="*{alergias}" /></div>
              <div class="col-12 col-md-6"><label class="form-label" for="observaciones">Observaciones</label><input class="form-control" id="observaciones" th:field="*{observaciones}" /></div>
            </div>
          </section>
          <div class="form-actions"><a class="btn btn-light" th:href="@{/clientes}">Cancelar</a><button class="btn btn-primary" type="submit">Registrar cliente</button></div>
        </form>
        <footer th:replace="~{fragments/ui :: footer}"></footer>
      </main>
    </div>
    <th:block th:replace="~{fragments/ui :: dialogs}"></th:block>
  </body>
</html>
