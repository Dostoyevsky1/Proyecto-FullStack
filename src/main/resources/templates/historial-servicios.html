<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Historial de servicios')}"></head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <aside th:replace="~{fragments/sidebar :: sidebar('tratamientos')}"></aside>
    <div class="app-main">
      <header th:replace="~{fragments/navbar :: navbar('Historial de servicios')}"></header>
      <main class="page-content" id="contenido">
        <div class="page-heading"><div><h1>Historial de servicios</h1><p th:text="${cliente.nombreCompleto}">Valeria Mendoza</p></div><div class="heading-actions"><a class="btn btn-primary" th:href="@{/tratamientos/nuevo(clienteId=${cliente.id})}"><i class="bi bi-plus-lg"></i>Registrar tratamiento</a></div></div>
        <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}">Tratamiento registrado correctamente</div>
        <section class="panel">
          <div class="timeline" th:if="${!#lists.isEmpty(sesiones)}">
            <article class="timeline-entry" th:each="sesion : ${sesiones}">
              <time class="timeline-date" th:text="${#temporals.format(sesion.fecha, 'dd MMM yyyy')}">18 SEP 2026</time>
              <h2 th:text="${sesion.servicio}">Hidratación profunda</h2>
              <div class="timeline-meta"><span><i class="bi bi-person"></i><span th:text="${sesion.especialista}">Andrea Salazar</span></span><span><i class="bi bi-clock"></i><span th:text="${sesion.duracionMinutos + ' min'}">90 min</span></span></div>
              <p th:text="${sesion.resultado}">Resultado observado</p>
            </article>
          </div>
          <div class="empty-state" th:if="${#lists.isEmpty(sesiones)}"><i class="bi bi-clock-history"></i><h2>No hay servicios registrados</h2><a class="btn btn-primary" th:href="@{/tratamientos/nuevo(clienteId=${cliente.id})}">Registrar tratamiento</a></div>
        </section>
        <footer th:replace="~{fragments/ui :: footer}"></footer>
      </main>
    </div>
    <th:block th:replace="~{fragments/ui :: dialogs}"></th:block>
  </body>
</html>
