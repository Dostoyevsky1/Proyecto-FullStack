<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Clientes')}"></head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <aside th:replace="~{fragments/sidebar :: sidebar('clientes')}"></aside>
    <div class="app-main">
      <header th:replace="~{fragments/navbar :: navbar('Clientes')}"></header>
      <main class="page-content" id="contenido">
        <div class="page-heading">
          <div><h1>Clientes</h1></div>
          <div class="heading-actions"><a class="btn btn-primary" th:href="@{/clientes/nuevo}"><i class="bi bi-plus-lg" aria-hidden="true"></i>Nuevo cliente</a></div>
        </div>
        <section class="panel" data-filter-scope>
          <div class="filter-toolbar">
            <div class="search-field"><i class="bi bi-search" aria-hidden="true"></i><label class="visually-hidden" for="clientSearch">Buscar cliente</label><input class="form-control" type="search" id="clientSearch" placeholder="Buscar por nombre o tipo de cabello" data-filter-search /></div>
            <span class="result-count"><strong data-result-count th:text="${#lists.size(clientes)}">8</strong> resultados</span>
          </div>
          <div class="filter-toolbar">
            <div class="filter-group" role="group" aria-label="Filtrar clientes">
              <button type="button" class="filter-button active" data-filter="todos" aria-pressed="true">Todos</button>
              <button type="button" class="filter-button" data-filter="ondulado" aria-pressed="false">Ondulado</button>
              <button type="button" class="filter-button" data-filter="rizado" aria-pressed="false">Rizado</button>
              <button type="button" class="filter-button" data-filter="afro" aria-pressed="false">Afro</button>
              <button type="button" class="filter-button" data-filter="liso" aria-pressed="false">Liso</button>
            </div>
          </div>
          <div class="table-responsive" tabindex="0">
            <table class="table clients-table">
              <thead><tr><th></th><th>Nombre</th><th>Teléfono</th><th>Tipo</th><th>Porosidad</th><th>Estado</th><th>Acciones</th></tr></thead>
              <tbody>
                <tr th:each="cliente : ${clientes}" data-filter-item th:attr="data-category=${#strings.toLowerCase(cliente.textura)},data-search=${cliente.nombreCompleto + ' ' + cliente.correo + ' ' + cliente.tipoCabello}">
                  <td><span class="avatar avatar-olive" th:text="${cliente.iniciales}">VM</span></td>
                  <td><a class="table-person" th:href="@{/clientes/perfil/{id}(id=${cliente.id})}"><span><strong class="client-name" th:text="${cliente.nombreCompleto}">Valeria Mendoza</strong><small th:text="${cliente.correo}">correo</small></span></a></td>
                  <td class="client-phone text-nowrap" th:text="${cliente.telefono}">900 000 001</td>
                  <td><span class="pill pill-neutral" th:text="${cliente.tipoCabello}">3B</span><small th:text="${cliente.textura}">Rizado</small></td>
                  <td th:text="${cliente.porosidad}">Alta</td>
                  <td><span class="pill pill-olive"><span class="status-dot"></span><span th:text="${cliente.estadoCapilar}">Seguimiento</span></span></td>
                  <td><a class="icon-button" th:href="@{/clientes/perfil/{id}(id=${cliente.id})}" th:aria-label="${'Ver perfil de ' + cliente.nombreCompleto}"><i class="bi bi-eye" aria-hidden="true"></i></a></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="empty-state" data-empty-state hidden><i class="bi bi-search"></i><h2>No hay resultados</h2><button class="btn btn-light" type="button" data-reset-filters>Limpiar filtros</button></div>
        </section>
        <footer th:replace="~{fragments/ui :: footer}"></footer>
      </main>
    </div>
    <th:block th:replace="~{fragments/ui :: dialogs}"></th:block>
  </body>
</html>
