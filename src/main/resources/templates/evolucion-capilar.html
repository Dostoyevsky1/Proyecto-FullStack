<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Evolución capilar')}"></head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <aside th:replace="~{fragments/sidebar :: sidebar('seguimiento')}"></aside>
    <div class="app-main">
      <header th:replace="~{fragments/navbar :: navbar('Evolución capilar')}"></header>
      <main class="page-content" id="contenido">
        <div class="page-heading"><div><h1>Evolución capilar</h1><p th:text="${cliente.nombreCompleto}">Valeria Mendoza</p></div><div class="heading-actions"><a class="btn btn-light" th:href="@{/portal/cliente/evolucion(clienteId=${cliente.id})}">Vista del cliente</a></div></div>
        <section class="evolution-list">
          <article class="panel evolution-record" th:each="item : ${evoluciones}">
            <div class="evolution-record-head"><div><h2 th:text="${#temporals.format(item.fecha, 'MMMM yyyy')}">Septiembre 2026</h2><p th:text="${item.observaciones}">Observaciones</p></div></div>
            <figure class="comparison-image evolution-comparison"><img th:src="${item.imagenAntes}" alt="Comparación del antes y después del tratamiento" /><span class="before-label">Antes</span><span class="after-label">Después</span></figure>
            <div class="metric-grid"><div><span>Hidratación</span><strong th:text="${item.hidratacion + '%'}">82%</strong><div class="progress progress-soft"><div class="progress-bar" th:style="${'width:' + item.hidratacion + '%'}"></div></div></div><div><span>Definición</span><strong th:text="${item.definicion + '%'}">86%</strong><div class="progress progress-soft"><div class="progress-bar" th:style="${'width:' + item.definicion + '%'}"></div></div></div><div><span>Control de frizz</span><strong th:text="${100 - item.frizz + '%'}">76%</strong><div class="progress progress-soft"><div class="progress-bar" th:style="${'width:' + (100 - item.frizz) + '%'}"></div></div></div><div><span>Elasticidad</span><strong th:text="${item.elasticidad + '%'}">80%</strong><div class="progress progress-soft"><div class="progress-bar" th:style="${'width:' + item.elasticidad + '%'}"></div></div></div></div>
          </article>
        </section>
        <footer th:replace="~{fragments/ui :: footer}"></footer>
      </main>
    </div>
    <th:block th:replace="~{fragments/ui :: dialogs}"></th:block>
  </body>
</html>
