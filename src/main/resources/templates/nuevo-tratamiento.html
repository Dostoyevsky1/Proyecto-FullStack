<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Registrar tratamiento')}"></head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <aside th:replace="~{fragments/sidebar :: sidebar('tratamientos')}"></aside>
    <div class="app-main">
      <header th:replace="~{fragments/navbar :: navbar('Registrar tratamiento')}"></header>
      <main class="page-content" id="contenido">
        <div class="page-heading"><div><h1>Registrar tratamiento</h1><p th:text="${cliente.nombreCompleto}">Valeria Mendoza</p></div></div>
        <form class="panel" th:action="@{/tratamientos}" th:object="${sesion}" method="post">
          <input type="hidden" th:field="*{clienteId}" />
          <section class="form-section"><div class="section-heading"><span class="section-icon"><i class="bi bi-droplet"></i></span><div><h2>Datos de la atención</h2></div></div><div class="row g-3">
            <div class="col-12 col-md-6"><label class="form-label" for="servicio">Tipo de servicio</label><select class="form-select" id="servicio" th:field="*{servicio}" required><option value="">Selecciona</option><option value="Hidratación profunda">Hidratación profunda</option><option value="Nutrición">Nutrición</option><option value="Reconstrucción">Reconstrucción</option><option value="Definición">Definición</option><option value="Corte">Corte</option><option value="Tratamiento de cuero cabelludo">Tratamiento de cuero cabelludo</option><option value="Otro">Otro</option></select></div>
            <div class="col-12 col-md-3"><label class="form-label" for="fecha">Fecha</label><input class="form-control" id="fecha" type="date" th:field="*{fecha}" required /></div>
            <div class="col-12 col-md-3"><label class="form-label" for="duracion">Duración</label><input class="form-control" id="duracion" type="number" min="15" step="15" th:field="*{duracionMinutos}" required /></div>
            <div class="col-12 col-md-6"><label class="form-label" for="especialista">Especialista</label><input class="form-control" id="especialista" th:field="*{especialista}" value="Andrea Salazar" /></div>
            <div class="col-12 col-md-6"><label class="form-label" for="plan">Plan de tratamiento</label><select class="form-select" id="plan" th:field="*{planTratamientoId}"><option value="">Sin asociar</option><option th:each="plan : ${planes}" th:value="${plan.id}" th:text="${plan.nombre}"></option></select></div>
            <div class="col-12"><label class="form-label" for="productos">Productos utilizados</label><input class="form-control" id="productos" th:field="*{productosUtilizados}" /></div>
            <div class="col-12 col-md-6"><label class="form-label" for="resultado">Resultado observado</label><textarea class="form-control" id="resultado" rows="4" th:field="*{resultado}"></textarea></div>
            <div class="col-12 col-md-6"><label class="form-label" for="observaciones">Observaciones</label><textarea class="form-control" id="observaciones" rows="4" th:field="*{observaciones}"></textarea></div>
            <div class="col-12 col-md-8"><label class="form-label" for="recomendaciones">Recomendaciones posteriores</label><input class="form-control" id="recomendaciones" th:field="*{recomendaciones}" /></div>
            <div class="col-12 col-md-4"><label class="form-label" for="proximoSeguimiento">Próximo seguimiento</label><input class="form-control" id="proximoSeguimiento" type="date" th:field="*{proximoSeguimiento}" /></div>
          </div></section>
          <div class="form-actions"><a class="btn btn-light" th:href="@{/historial(clienteId=${cliente.id})}">Cancelar</a><button class="btn btn-primary" type="submit">Registrar tratamiento</button></div>
        </form>
        <footer th:replace="~{fragments/ui :: footer}"></footer>
      </main>
    </div>
    <th:block th:replace="~{fragments/ui :: dialogs}"></th:block>
  </body>
</html>
