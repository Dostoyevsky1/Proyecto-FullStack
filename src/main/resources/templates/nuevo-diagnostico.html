<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Nuevo diagnóstico')}"></head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <aside th:replace="~{fragments/sidebar :: sidebar('diagnosticos')}"></aside>
    <div class="app-main">
      <header th:replace="~{fragments/navbar :: navbar('Nuevo diagnóstico')}"></header>
      <main class="page-content" id="contenido">
        <div class="page-heading"><div><h1>Nuevo diagnóstico capilar</h1></div></div>
        <section class="client-context"><a th:href="@{/clientes/perfil/{id}(id=${cliente.id})}"><span class="avatar avatar-olive" th:text="${cliente.iniciales}">VM</span><span><strong th:text="${cliente.nombreCompleto}">Valeria Mendoza</strong><small th:text="${cliente.tipoCabello + ' · Porosidad ' + cliente.porosidad}">3B</small></span></a></section>
        <form class="panel" th:action="@{/diagnosticos}" th:object="${diagnostico}" method="post">
          <input type="hidden" th:field="*{clienteId}" />
          <section class="form-section"><div class="section-heading"><span class="section-icon"><i class="bi bi-bezier2"></i></span><div><h2>Características capilares</h2></div></div><div class="row g-3">
            <div class="col-12 col-md-3"><label class="form-label" for="patronCapilar">Patrón</label><select class="form-select" id="patronCapilar" th:field="*{patronCapilar}" required><option th:each="tipo : ${#strings.arraySplit('2A,2B,2C,3A,3B,3C,4A,4B,4C', ',')}" th:value="${tipo}" th:text="${tipo}"></option></select></div>
            <div class="col-12 col-md-3"><label class="form-label" for="porosidad">Porosidad</label><select class="form-select" id="porosidad" th:field="*{porosidad}"><option value="Baja">Baja</option><option value="Media">Media</option><option value="Alta">Alta</option></select></div>
            <div class="col-12 col-md-3"><label class="form-label" for="densidad">Densidad</label><select class="form-select" id="densidad" th:field="*{densidad}"><option value="Baja">Baja</option><option value="Media">Media</option><option value="Alta">Alta</option></select></div>
            <div class="col-12 col-md-3"><label class="form-label" for="grosor">Grosor</label><select class="form-select" id="grosor" th:field="*{grosor}"><option value="Fino">Fino</option><option value="Medio">Medio</option><option value="Grueso">Grueso</option></select></div>
          </div></section>
          <section class="form-section"><div class="section-heading"><span class="section-icon"><i class="bi bi-clipboard2-pulse"></i></span><div><h2>Evaluación</h2></div></div><div class="row g-3">
            <div class="col-12"><label class="form-label" for="problemas">Problemas identificados</label><input class="form-control" id="problemas" th:field="*{problemasIdentificados}" placeholder="Deshidratación, frizz, puntas secas" required /></div>
            <div class="col-12 col-md-6"><label class="form-label" for="habitos">Hábitos</label><textarea class="form-control" id="habitos" th:field="*{habitos}" rows="4"></textarea></div>
            <div class="col-12 col-md-6"><label class="form-label" for="observaciones">Observaciones</label><textarea class="form-control" id="observaciones" th:field="*{observaciones}" rows="4"></textarea></div>
            <div class="col-12"><label class="form-label" for="recomendacion">Recomendación</label><textarea class="form-control" id="recomendacion" th:field="*{recomendacion}" rows="3"></textarea></div>
          </div></section>
          <div class="form-actions"><a class="btn btn-light" th:href="@{/clientes/perfil/{id}(id=${cliente.id})}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar diagnóstico</button></div>
        </form>
        <footer th:replace="~{fragments/ui :: footer}"></footer>
      </main>
    </div>
    <th:block th:replace="~{fragments/ui :: dialogs}"></th:block>
  </body>
</html>
